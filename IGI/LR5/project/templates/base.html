{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pharmacy — онлайн-каталог лекарственных средств и товаров аптеки.">
    <meta name="keywords" content="аптека, лекарства, медикаменты, фармацевтика, каталог">
    <meta name="author" content="Pharmacy">

    <title>{% block title %}Аптека у Пабло{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/special.css' %}">
    <link rel="stylesheet" href="{% static 'css/preload.css' %}">
    <link rel="stylesheet" href="{% static 'css/anim.css' %}">
    <link rel="icon" href="{% static 'images/favicon.png' %}">
</head>

<body>
    <header class="site-header-content">{% include 'includes/header.html' %}</header>

    {% if messages %}
    <section aria-label="Системные сообщения">
        {% for message in messages %}
        <p role="status">{{ message }}</p>
        {% endfor %}
    </section>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>{% include 'includes/footer.html' %}</footer>
</body>

</html>
