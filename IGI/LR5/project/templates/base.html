{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Pharmacy — онлайн-каталог лекарственных средств и товаров аптеки." >
    <meta name="keywords"
        content="аптека, лекарства, медикаменты, фармацевтика, каталог" >
    <meta name="author"
        content="Pharmacy" >

    <title>{% block title %}Аптека у Пабло{% endblock %}</title>
    <link rel="icon"
      href="{% static 'images/favicon.png' %}">
</head>
<body>
    <header>{% include 'includes/header.html' %}</header>

    {% if messages %}
        <section aria-label="Системные сообщения">
            {% for message in messages %}
                <p role="status">{{ message }}</p>
            {% endfor %}
        </section>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>{% include 'includes/footer.html' %}</footer>
</body>
</html>
