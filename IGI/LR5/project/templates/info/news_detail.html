{% extends 'base.html' %}

{% block title %}{{ news.title }}{% endblock %}

{% block content %}
<article class="content-article" aria-labelledby="news-detail-title">

    <h1 id="news-detail-title">{{ news.title }}</h1>

    {% if news.image %}
    <figure class="content-figure content-figure--news">
        <img class="content-image" src="{{ news.image.url }}" alt="{{ news.title }}">
        <figcaption>{{ news.title }}</figcaption>
    </figure>
    {% endif %}

    <section class="content-section" aria-label="Текст новости">
        <p>{{ news.content }}</p>
    </section>

    <div class="content-meta">
        <span>
            Опубликовано:
            <time datetime="{{ news.created_at|date:'c' }}">
                {{ news.created_at|date:"d.m.Y H:i" }}
            </time>
        </span>
    </div>

</article>
{% endblock %}
