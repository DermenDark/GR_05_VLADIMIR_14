{% extends 'base.html' %}
{% block title %}{{ news.title }}{% endblock %}

{% block content %}
<article aria-labelledby="news-detail-title">
    <h1 id="news-detail-title">{{ news.title }}</h1>

    {% if news.image %}
        <figure>
            <img src="{{ news.image.url }}" alt="{{ news.title }}" style="max-width: 300px;">
            <figcaption>{{ news.title }}</figcaption>
        </figure>
    {% endif %}

    <p>{{ news.content }}</p>
    <p><time datetime="{{ news.created_at|date:'c' }}">{{ news.created_at }}</time></p>
</article>
{% endblock %}
