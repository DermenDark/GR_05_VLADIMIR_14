{% extends 'base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<div>
    <h1>Вход</h1>

    <div>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="login">
            <input type="hidden" name="next" value="{{ next }}">
            {{ login_form.as_p }}
            <button type="submit">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
