{% extends 'base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<section aria-labelledby="login-title">
    <h1 id="login-title">Вход</h1>

    <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="login">
            <input type="hidden" name="next" value="{{ next }}">
            {{ login_form.as_p }}
            <button type="submit">Войти</button>
    </form>
</section>
{% endblock %}
