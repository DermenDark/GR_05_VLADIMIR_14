<div class="footer-content">
    <section aria-labelledby="footer-info-title">
        <h2 id="footer-info-title">Аптека у Пабло</h2>
        <p>© 2026 Pharmacy</p>

        <div class="subscription-controls">
            <label for="subscription-email">
                Подписка:
                <input
                    type="email"
                    id="subscription-email"
                    name="email"
                    placeholder="Ваш email"
                    class="input"
                >
            </label>
            <button type="button">Отправить</button>
        </div>
    </section>

    <section aria-labelledby="partners-title">
        <h2 id="partners-title">Наши партнеры</h2>
        {% for partner in partners %}
            <article>
                <a href="{{ partner.website_url }}" target="_blank" rel="noopener noreferrer">
                    {% if partner.logo %}
                        <img src="{{ partner.logo.url }}" alt="{{ partner.name }}" width="150">
                    {% elif partner.logo_url %}
                        <img src="{{ partner.logo_url }}" alt="{{ partner.name }}" width="150">
                    {% else %}
                        {{ partner.name }}
                    {% endif %}
                </a>
            </article>
        {% empty %}
            <p>Партнеры пока не добавлены.</p>
        {% endfor %}
    </section>

    <p>
        <a href="/politic/">Политика конфиденциальности</a>
    </p>
</div>
